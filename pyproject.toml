[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaalgo-feed-receiver"
version = "0.1.0"
description = "Signed webhook receiver (v3) for the AlphaAlgo Developer Feed."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alphaalgo-receiver = "alphaalgo_receiver.cli:main"

[tool.ruff]
line-length = 80
