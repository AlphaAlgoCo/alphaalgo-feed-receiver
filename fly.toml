# Fly.io configuration for AlphaAlgo Feed v3 Signed Webhook Receiver.
# Replace `app` with your own unique Fly.io app name (or run `fly launch`).
app = "alphaalgo-feed-receiver"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  ALPHAALGO_HOST = "0.0.0.0"
  ALPHAALGO_PORT = "9091"
  ALPHAALGO_DB_PATH = "/data/receipts.db"
  ALPHAALGO_JSONL_LOG = "/data/events.jsonl"
  ALPHAALGO_ASYNC_HANDLERS = "true"

[[mounts]]
  source = "alphaalgo_data"
  destination = "/data"

[http_service]
  internal_port = 9091
  force_https = true
  # Keep at least 1 machine warm so webhook deliveries never time out on cold boot.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
